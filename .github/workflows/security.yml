name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 18 * * 1"

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install -e ".[dev]"
      - name: Bandit
        run: bandit -r agent scripts
      - name: Pip audit
        run: pip-audit
