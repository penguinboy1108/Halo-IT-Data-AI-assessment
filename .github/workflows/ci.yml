name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Prepare data
        run: python src/prepare_data.py
      - name: Build DuckDB
        run: python scripts/build_duckdb.py
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy agent
      - name: Tests
        run: pytest --cov=agent --cov-report=term-missing
      - name: Docker build
        run: docker build .
