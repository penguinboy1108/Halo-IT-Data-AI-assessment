[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halo-it-data-ai-agent"
version = "0.1.0"
description = "Read-only operational analytics agent for the Halo IT Data & AI assessment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.1,<2",
  "groq>=0.11,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=23.0.1,<24",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
  "sqlglot>=25,<30",
  "streamlit>=1.38,<2",
  "tenacity>=9,<10",
  "structlog>=24,<26",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.11,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["config/*.yaml", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
